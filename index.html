<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bear AR Camera</title>
<style>
  :root { --red:#c8102e; --navy:#0b1f4b; --cream:#fff8e7; }
  html,body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vid { position:fixed; width:2px; height:2px; opacity:0; pointer-events:none; left:0; top:0; }
  .top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0; text-align:center; pointer-events:none; }
  #status { display:inline-block; padding:6px 14px; border-radius:99px; background:rgba(0,0,0,.55); font-size:13px; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 max(28px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(28px,env(safe-area-inset-left,0px)); }
  .bar .sp { width:64px; }
  button { font:inherit; color:#fff; border:0; cursor:pointer; }
  #flip { width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.55); font-size:12px; line-height:1.2; }
  #shutter { width:78px; height:78px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.5); background-clip:padding-box; }
  #shutter:active { transform:scale(.94); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:24px max(24px,env(safe-area-inset-right,0px)); text-align:center; background:var(--navy); }
  .screen[hidden] { display:none; }
  .screen img.hero { width:min(46vw,200px); height:auto; }
  .screen h1 { margin:0; font-size:24px; }
  .screen p { margin:0; font-size:14px; line-height:1.6; max-width:22em; opacity:.9; }
  .primary { background:var(--red); padding:14px 28px; border-radius:99px; font-size:17px; font-weight:700; }
  .ghost { background:rgba(255,255,255,.18); padding:12px 24px; border-radius:99px; font-size:15px; }
  #preview { background:rgba(0,0,0,.92); justify-content:flex-start; padding-top:calc(env(safe-area-inset-top,0px) + 16px); }
  #preview img { max-width:100%; max-height:64vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.6); -webkit-user-select:auto; user-select:auto; -webkit-touch-callout:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  small { opacity:.7; font-size:12px; }
</style>
</head>

<video id="vid" playsinline muted autoplay></video>
<div class="top"><span id="status" hidden></span></div>
<div class="bar" id="bar" hidden>
  <button id="flip" aria-label="カメラ切り替え">カメラ<br>切替</button>
  <button id="shutter" aria-label="撮影"></button>
  <div class="sp"></div>
</div>
<div id="flash"></div>

  <h1>クマと一緒に撮ろう</h1>
  <p>内カメで顔を映すと、クマが頭に乗ります。外カメではフレームつきで撮れます。</p>
  <button class="primary" id="go">カメラを起動</button>
  <small id="err"></small>
</div>

<div class="screen" id="preview" hidden>
  <img id="shot" alt="撮影した写真">
  <div class="row">
    <button class="primary" id="save">保存・共有</button>
    <button class="ghost" id="retake">撮り直す</button>
  </div>
  <small>うまく保存できない場合は、写真を長押ししてください。</small>
</div>

<script>
// ===== 設定（ここを調整） =====
const FRAME_TEXT   = 'WELCOME';   // 外カメのリボンに入る文字
const HEAD_SCALE   = 1.15;        // 頭に乗るクマの大きさ（顔の幅に対する比率）
const HEAD_LIFT    = 0.10;        // 頭のてっぺんからクマの足元までの距離（顔の幅に対する比率）
const MAX_FACES    = 3;
const MP_VER       = '0.10.14';
const MP_BASE      = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const MODEL_URL    = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
// =============================

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const vid = $('vid');
const bear = new Image();
bear.src = $('start').querySelector('img.hero').src;

let facing = 'user';
let stream = null;
let landmarker = null;
let landmarkerFailed = false;
let faces = [];            // 検出結果（canvas座標に変換済み）
let lastVideoTime = -1;
let states = [];           // 顔ごとの平滑化状態
let running = false;

function setStatus(t) {
  const s = $('status');
  if (!t) { s.hidden = true; return; }
  s.hidden = false; s.textContent = t;
}

function sizeCanvas() {
  const w = 720;
  const h = Math.round(w * (window.innerHeight / window.innerWidth));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

async function initLandmarker() {
  try {
    const vision = await import(MP_BASE + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
    const make = d => vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: d },
      runningMode: 'VIDEO', numFaces: MAX_FACES
    });
    try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
  } catch (e) {
    console.error(e);
    landmarkerFailed = true;
  }
}

async function startCamera(mode) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; faces = []; states = []; lastVideoTime = -1;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: mode }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  vid.srcObject = stream;
  await vid.play();
  facing = mode;
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function detect(geom) {
  faces = [];
  if (!landmarker || vid.currentTime === lastVideoTime) return;
  lastVideoTime = vid.currentTime;
  let res;
  try { res = landmarker.detectForVideo(vid, performance.now()); } catch (e) { return; }
  const { cw, vw, vh, s, ox, oy } = geom;
  const pt = l => ({ x: cw - (ox + l.x * vw * s), y: oy + l.y * vh * s });
  for (const lm of (res.faceLandmarks || [])) {
    const top = pt(lm[10]), chin = pt(lm[152]), left = pt(lm[234]), right = pt(lm[454]);
    const w = dist(left, right);
    const ux = top.x - chin.x, uy = top.y - chin.y, ul = Math.hypot(ux, uy) || 1;
    const up = { x: ux / ul, y: uy / ul };
    faces.push({
      x: top.x + up.x * w * HEAD_LIFT,
      y: top.y + up.y * w * HEAD_LIFT,
      w: w * HEAD_SCALE,
      a: Math.atan2(up.x, -up.y)
    });
  }
  faces.sort((p, q) => p.x - q.x);
}

function drawBear(x, y, w, angle, alpha, t, phase) {
  const h = w * bear.naturalHeight / bear.naturalWidth;
  const bob = Math.abs(Math.sin(t * 3.2 + phase)) * h * 0.035;
  const sq = 1 + Math.sin(t * 6.4 + phase) * 0.012;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.translate(0, -bob);
  ctx.scale(1 / sq, sq);
  ctx.drawImage(bear, -w / 2, -h, w, h);
  ctx.restore();
}

function updateHeadBears(t) {
  const k = 0.35;
  for (let i = 0; i < faces.length; i++) {
    const f = faces[i], st = states[i];
    if (!st) states[i] = { ...f, alpha: 0 };
    else { st.x += (f.x - st.x) * k; st.y += (f.y - st.y) * k; st.w += (f.w - st.w) * k; st.a += (f.a - st.a) * k; }
    states[i].alpha = Math.min(1, states[i].alpha + 0.2);
    states[i].seen = true;
  }
  for (let i = faces.length; i < states.length; i++) {
    if (!states[i]) continue;
    states[i].alpha = Math.max(0, states[i].alpha - 0.08);
  }
  let any = false;
  states.forEach((st, i) => {
    if (st && st.alpha > 0.02) { drawBear(st.x, st.y, st.w, st.a, st.alpha, t, i * 1.7); any = true; }
  });
  return any;
}

function drawFrameDeco(cw, ch, t) {
  const b = cw * 0.035;
  ctx.save();
  ctx.fillStyle = '#0b1f4b';
  ctx.beginPath();
  ctx.rect(0, 0, cw, ch);
  const r = cw * 0.05;
  const x0 = b, y0 = b, x1 = cw - b, y1 = ch - b;
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x1, y0, x1, y1, r); ctx.arcTo(x1, y1, x0, y1, r);
  ctx.arcTo(x0, y1, x0, y0, r); ctx.arcTo(x0, y0, x1, y0, r);
  ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = '#fff8e7'; ctx.lineWidth = Math.max(2, cw * 0.004);
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.arcTo(x1, y0, x1, y1, r); ctx.arcTo(x1, y1, x0, y1, r);
  ctx.arcTo(x0, y1, x0, y0, r); ctx.arcTo(x0, y0, x1, y0, r);
  ctx.closePath(); ctx.stroke();
  // リボン
  const rh = ch * 0.07, ry = ch - b - rh - ch * 0.02;
  ctx.fillStyle = '#c8102e';
  ctx.fillRect(b, ry, cw - b * 2, rh);
  ctx.fillStyle = '#fff8e7';
  ctx.font = '700 ' + Math.round(rh * 0.5) + 'px -apple-system,"Hiragino Sans",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(FRAME_TEXT, cw / 2, ry + rh / 2);
  ctx.restore();
  // 右下のクマ
  const bw = cw * 0.36;
  drawBear(cw - b - bw * 0.62, ry + rh * 0.35, bw, Math.sin(t * 1.6) * 0.05, 1, t, 0);
}

function draw(now) {
  requestAnimationFrame(draw);
  if (!running || vid.readyState < 2) return;
  const t = now / 1000;
  const cw = cv.width, ch = cv.height;
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw || !vh) return;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const mirror = facing === 'user';

  ctx.save();
  if (mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(vid, ox, oy, vw * s, vh * s);
  ctx.restore();

  if (mirror) {
    if (landmarker) {
      detect({ cw, vw, vh, s, ox, oy });
      const any = updateHeadBears(t);
      setStatus(any ? '' : '顔を映すとクマが頭に乗ります');
    } else if (landmarkerFailed) {
      setStatus('顔認識を読み込めませんでした（固定表示）');
      drawBear(cw * 0.5, ch * 0.28, cw * 0.4, Math.sin(t * 1.6) * 0.05, 1, t, 0);
    } else {
      setStatus('顔認識を準備中…');
    }
  } else {
    setStatus('');
    drawFrameDeco(cw, ch, t);
  }
}

async function begin() {
  $('err').textContent = '';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
    await startCamera('user');
  } catch (e) {
    $('err').textContent = (location.protocol === 'http:' && location.hostname !== 'localhost')
      ? 'カメラはhttpsのページでのみ使えます。'
      : 'カメラを使えませんでした。ブラウザのカメラ許可を確認してください。';
    return;
  }
  $('start').hidden = true;
  $('bar').hidden = false;
  running = true;
  if (!landmarker && !landmarkerFailed) initLandmarker();
}

$('go').addEventListener('click', begin);

$('flip').addEventListener('click', async () => {
  running = false;
  try { await startCamera(facing === 'user' ? 'environment' : 'user'); }
  catch (e) { try { await startCamera(facing); } catch (_) {} }
  running = true;
});

let lastBlob = null, lastURL = null;
$('shutter').addEventListener('click', () => {
  if (!running) return;
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '.85';
  requestAnimationFrame(() => { f.style.transition = 'opacity .35s'; f.style.opacity = '0'; });
  cv.toBlob(blob => {
    if (!blob) return;
    lastBlob = blob;
    if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(blob);
    $('shot').src = lastURL;
    $('preview').hidden = false;
    running = false;
  }, 'image/jpeg', 0.92);
});

$('retake').addEventListener('click', () => { $('preview').hidden = true; running = true; });

$('save').addEventListener('click', async () => {
  if (!lastBlob) return;
  const file = new File([lastBlob], 'bear-photo.jpg', { type: 'image/jpeg' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = lastURL; a.download = 'bear-photo.jpg';
  document.body.appendChild(a); a.click(); a.remove();
});

requestAnimationFrame(draw);
</script>
</body>
</html>
