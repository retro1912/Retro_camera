<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retro-Bear AR Camera</title>
<link rel="icon" href="images/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b1f4b">
<style>
  :root { --red:#c8102e; --navy:#0b1f4b; --cream:#fff8e7; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vid { position:fixed; width:2px; height:2px; opacity:0; pointer-events:none; left:0; top:0; }
  .top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0; text-align:center; pointer-events:none; }
  #status { display:inline-block; padding:6px 14px; border-radius:99px; background:rgba(0,0,0,.55); font-size:13px; }
  .bar { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 max(28px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(28px,env(safe-area-inset-left,0px)); }
  .bar .sp { width:64px; }
  button { font:inherit; color:#fff; border:0; cursor:pointer; }
  #flip { width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.55); font-size:12px; line-height:1.2; }
  #shutter { width:78px; height:78px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.5); background-clip:padding-box; }
  #shutter:active { transform:scale(.94); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }

  /* スタンプ・フレームの選択バー */
  #strip { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 22px + 78px + 12px);
    display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px)); }
  #strip::-webkit-scrollbar { display:none; }
  #strip[hidden] { display:none; }
  .chip { flex:0 0 auto; width:62px; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; padding:0; }
  .chip .thumb { width:56px; height:56px; border-radius:14px; background:rgba(0,0,0,.55); border:3px solid transparent;
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:11px; }
  .chip .thumb img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .chip .name { font-size:10px; line-height:1.2; text-shadow:0 1px 3px rgba(0,0,0,.8); white-space:nowrap; max-width:62px; overflow:hidden; text-overflow:ellipsis; }
  .chip[aria-pressed="true"] .thumb { border-color:#fff; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:24px max(24px,env(safe-area-inset-right,0px)); text-align:center; background:var(--navy); }
  .screen[hidden] { display:none; }
  .screen img.hero { width:min(46vw,200px); height:auto; }
  .screen h1 { margin:0; font-size:24px; }
  .screen p { margin:0; font-size:14px; line-height:1.6; max-width:22em; opacity:.9; white-space:pre-line; }
  .primary { background:var(--red); padding:14px 28px; border-radius:99px; font-size:17px; font-weight:700; }
  .ghost { background:rgba(255,255,255,.18); padding:12px 24px; border-radius:99px; font-size:15px; }
  #preview { background:rgba(0,0,0,.92); justify-content:flex-start; padding-top:calc(env(safe-area-inset-top,0px) + 16px); }
  #preview img, #snap { display:block; max-width:100%; max-height:64vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.6); -webkit-user-select:auto; user-select:auto; -webkit-touch-callout:default; }
  button:disabled { opacity:.6; cursor:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  small { opacity:.7; font-size:12px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<video id="vid" playsinline muted autoplay></video>
<div class="top"><span id="status" hidden></span></div>
<div id="strip" hidden></div>
<div class="bar" id="bar" hidden>
  <button id="flip" aria-label="カメラ切り替え">カメラ<br>切替</button>
  <button id="shutter" aria-label="撮影"></button>
  <div class="sp"></div>
</div>
<div id="flash"></div>

<div class="screen" id="gate" hidden>
  <img class="hero" id="gateHero" alt="">
  <h1>位置情報を確認します</h1>
  <p id="gateText">このカメラは、お店の中でだけ遊べます。下のボタンを押して、位置情報の利用を許可してください。</p>
  <button class="primary" id="gateGo">位置情報を確認する</button>
  <small id="gateInfo"></small>
</div>

<div class="screen" id="start">
  <img class="hero" id="hero" alt="">
  <h1>レトロベアと一緒に撮ろう</h1>
  <p>内カメで顔を映すと、スタンプが顔につきます。外カメではフレームつきで撮れます。下のボタンで種類を選べます。</p>
  <button class="primary" id="go">カメラを起動</button>
  <small id="err"></small>
</div>

<div class="screen" id="preview" hidden>
  <canvas id="snap"></canvas>
  <img id="shot" alt="撮影した写真" hidden>
  <div class="row">
    <button class="primary" id="save">保存・共有</button>
    <button class="ghost" id="retake">撮り直す</button>
  </div>
  <small>うまく保存できない場合は、写真を長押ししてください。</small>
</div>

<script src="config.js"></script>
<script>
// ===== 基本設定 =====
const CFG        = window.APP_CONFIG || { stamps: [], frames: [], maxFaces: 3 };
const MAX_FACES  = CFG.maxFaces || 3;
const MP_VER     = '0.10.14';
const MP_BASE    = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const MODEL_URL  = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
// 顔のどの点にスタンプを付けるか（MediaPipeのランドマーク番号）
const ANCHOR_LM  = { eyes: 168, nose: 1, mouth: 13 };
// =====================

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const vid = $('vid');

// 画像の読み込み（失敗しても止まらない）
function loadImg(src) {
  const im = new Image();
  im.src = src;
  return im;
}
const ready = im => im && im.complete && im.naturalWidth > 0;
// スタンプは「パーツ」の集まり。parts がなければ、スタンプ自身を1パーツとして扱う。
CFG.stamps.forEach(s => {
  if (!Array.isArray(s.parts) || !s.parts.length) {
    s.parts = [{ src: s.src, anchor: s.anchor, scale: s.scale, lift: s.lift, bob: s.bob }];
  }
  s.parts.forEach(p => { p.img = loadImg(p.src); });
  s.thumb = s.thumb || s.src || s.parts[0].src;   // 選択ボタンの絵
});
CFG.frames.forEach(f => { f.img = loadImg(f.src); });
if (CFG.stamps[0]) $('hero').src = CFG.stamps[0].thumb;

let facing = 'user';
let stream = null;
let landmarker = null;
let landmarkerFailed = false;
let faces = [];            // 検出結果（canvas座標に変換済み）
let lastVideoTime = -1;
let states = [];           // 顔ごとの平滑化状態
let running = false;
let curStamp = CFG.stamps[0] || null;   // 選択中のスタンプ
let curFrame = CFG.frames[0] || null;   // 選択中のフレーム（外カメ）
// 内カメで固定表示するフレーム（config.js の frontFrame で指定。なければフレームなし）
// { src, fit } と書くと内カメ専用になり、外カメの選択肢には出ない。文字列でid指定する書き方も使える。
const frontFrame = (() => {
  const ff = CFG.frontFrame;
  if (!ff) return null;
  if (typeof ff === 'string') return CFG.frames.find(f => f.id === ff) || null;
  return { fit: 'stretch', ...ff, img: loadImg(ff.src) };
})();

function setStatus(t) {
  const s = $('status');
  if (!t) { s.hidden = true; return; }
  s.hidden = false; s.textContent = t;
}

function sizeCanvas() {
  const w = 720;
  const h = Math.round(w * (window.innerHeight / window.innerWidth));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

// ===== 選択バー =====
function buildStrip() {
  const strip = $('strip');
  strip.textContent = '';
  const isFront = facing === 'user';
  const list = isFront ? CFG.stamps : CFG.frames;
  const current = isFront ? curStamp : curFrame;
  if (!list.length) { strip.hidden = true; return; }
  strip.hidden = false;

  const make = (item, label) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.setAttribute('aria-pressed', String(item === current));
    const th = document.createElement('span'); th.className = 'thumb';
    if (item) { const im = document.createElement('img'); im.src = item.thumb || item.src; im.alt = ''; th.appendChild(im); }
    else { th.textContent = 'なし'; }
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = label;
    b.append(th, nm);
    b.addEventListener('click', () => {
      if (isFront) { curStamp = item; states = []; } else { curFrame = item; }
      strip.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
    });
    return b;
  };
  strip.appendChild(make(null, 'なし'));
  list.forEach(it => strip.appendChild(make(it, it.label || '')));
}

// ===== 顔認識 =====
async function initLandmarker() {
  try {
    const vision = await import(MP_BASE + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
    const make = d => vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: d },
      runningMode: 'VIDEO', numFaces: MAX_FACES
    });
    try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
  } catch (e) {
    console.error(e);
    landmarkerFailed = true;
  }
}

async function startCamera(mode) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; faces = []; states = []; lastVideoTime = -1;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: mode }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  vid.srcObject = stream;
  await vid.play();
  facing = mode;
  buildStrip();
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function detect(geom) {
  faces = [];
  if (!landmarker || vid.currentTime === lastVideoTime) return;
  lastVideoTime = vid.currentTime;
  let res;
  try { res = landmarker.detectForVideo(vid, performance.now()); } catch (e) { return; }
  const { cw, vw, vh, s, ox, oy } = geom;
  const pt = l => ({ x: cw - (ox + l.x * vw * s), y: oy + l.y * vh * s });
  for (const lm of (res.faceLandmarks || [])) {
    const top = pt(lm[10]), chin = pt(lm[152]), left = pt(lm[234]), right = pt(lm[454]);
    const eyes = pt(lm[ANCHOR_LM.eyes]), nose = pt(lm[ANCHOR_LM.nose]), mouth = pt(lm[ANCHOR_LM.mouth]);
    const w = dist(left, right);
    const ux = top.x - chin.x, uy = top.y - chin.y;
    faces.push({
      w, a: Math.atan2(ux, -uy),
      head_x: top.x,  head_y: top.y,
      eyes_x: eyes.x, eyes_y: eyes.y,
      nose_x: nose.x, nose_y: nose.y,
      mouth_x: mouth.x, mouth_y: mouth.y
    });
  }
  faces.sort((p, q) => p.head_x - q.head_x);
}

// ===== 描画 =====
// 画像を (x,y) に置く。origin='bottom' は画像の下端中央、'center' は中央が基準。
function drawSprite(img, x, y, w, angle, alpha, origin, bobAmt, t, phase) {
  if (!ready(img)) return;
  const h = w * img.naturalHeight / img.naturalWidth;
  const bob = bobAmt ? Math.abs(Math.sin(t * 3.2 + phase)) * h * 0.035 : 0;
  const sq = bobAmt ? 1 + Math.sin(t * 6.4 + phase) * 0.012 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.translate(0, -bob);
  ctx.scale(1 / sq, sq);
  ctx.drawImage(img, -w / 2, origin === 'bottom' ? -h : -h / 2, w, h);
  ctx.restore();
}

function drawStampOnFace(st, stamp, t, phase) {
  const up = { x: Math.sin(st.a), y: -Math.cos(st.a) };
  stamp.parts.forEach((part, k) => {
    const anchor = part.anchor || 'head';
    const px = st[anchor + '_x'], py = st[anchor + '_y'];
    const lift = (part.lift || 0) * st.w;
    drawSprite(part.img, px + up.x * lift, py + up.y * lift, st.w * (part.scale || 0.5),
      st.a, st.alpha, anchor === 'head' ? 'bottom' : 'center', part.bob, t, phase + k * 0.4);
  });
}

function updateStamps(t) {
  if (!curStamp) return false;
  const k = 0.35;
  for (let i = 0; i < faces.length; i++) {
    const f = faces[i];
    if (!states[i]) states[i] = { ...f, alpha: 0 };
    else for (const key in f) states[i][key] += (f[key] - states[i][key]) * k;
    states[i].alpha = Math.min(1, states[i].alpha + 0.2);
  }
  for (let i = faces.length; i < states.length; i++) {
    if (states[i]) states[i].alpha = Math.max(0, states[i].alpha - 0.08);
  }
  let any = false;
  states.forEach((st, i) => {
    if (st && st.alpha > 0.02) { drawStampOnFace(st, curStamp, t, i * 1.7); any = true; }
  });
  return any;
}

function drawFrame(cw, ch, frame) {
  if (!frame || !ready(frame.img)) return;
  const im = frame.img;
  if (frame.fit === 'cover') {
    const s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h);
  } else {
    ctx.drawImage(im, 0, 0, cw, ch);
  }
}

function draw(now) {
  requestAnimationFrame(draw);
  if (!running || vid.readyState < 2) return;
  const t = now / 1000;
  const cw = cv.width, ch = cv.height;
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw || !vh) return;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const mirror = facing === 'user';

  ctx.save();
  if (mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(vid, ox, oy, vw * s, vh * s);
  ctx.restore();

  if (mirror) {
    if (landmarker) {
      detect({ cw, vw, vh, s, ox, oy });
      const any = updateStamps(t);
      setStatus(any || !curStamp ? '' : '顔を映すとスタンプがつきます');
    } else if (landmarkerFailed) {
      setStatus('顔認識を読み込めませんでした（固定表示）');
      if (curStamp) drawSprite(curStamp.parts[0].img, cw * 0.5, ch * 0.28, cw * 0.4, Math.sin(t * 1.6) * 0.05, 1, 'bottom', curStamp.parts[0].bob, t, 0);
    } else {
      setStatus('顔認識を準備中…');
    }
    drawFrame(cw, ch, frontFrame);   // 内カメの固定フレームは、スタンプより手前に重ねる
  } else {
    setStatus('');
    drawFrame(cw, ch, curFrame);
  }
}

// ===== 操作 =====
async function begin() {
  $('err').textContent = '';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
    await startCamera('user');
  } catch (e) {
    $('err').textContent = (location.protocol === 'http:' && location.hostname !== 'localhost')
      ? 'カメラはhttpsのページでのみ使えます。'
      : 'カメラを使えませんでした。ブラウザのカメラ許可を確認してください。';
    return;
  }
  $('start').hidden = true;
  $('bar').hidden = false;
  running = true;
  if (!landmarker && !landmarkerFailed) initLandmarker();
}

$('go').addEventListener('click', begin);

// ===== 位置情報の確認（お店の中だけで遊べるようにする） =====
const GATE = CFG.gate || {};
const gateOn = GATE.enabled !== false && Number.isFinite(GATE.lat) && Number.isFinite(GATE.lng);
const PASS_KEY = 'retroBearGatePass';

function hasPass() {
  try {
    const t = Number(sessionStorage.getItem(PASS_KEY));
    return t > 0 && Date.now() - t < (GATE.passMinutes ?? 30) * 60000;
  } catch (e) { return false; }
}
function savePass() { try { sessionStorage.setItem(PASS_KEY, String(Date.now())); } catch (e) {} }

// 2点間の距離（メートル）
function meters(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function gateMessage(text, info) {
  $('gateText').textContent = text;
  $('gateInfo').textContent = info || '';
}
function gateOpen() { $('gate').hidden = true; $('start').hidden = false; }

function checkLocation() {
  const btn = $('gateGo');
  if (!navigator.geolocation) {
    gateMessage('このブラウザでは位置情報を使えません。別のブラウザでお試しください。');
    return;
  }
  btn.disabled = true; btn.textContent = '確認中…';
  gateMessage('現在地を確認しています。少しお待ちください。');
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false; btn.textContent = 'もう一度確認する';
    const { latitude, longitude, accuracy } = pos.coords;
    const d = meters(latitude, longitude, GATE.lat, GATE.lng);
    // 屋内はGPSがずれるので、誤差のぶんだけ甘く判定する（誤差の上限は maxAccuracy）
    const slack = Math.min(accuracy || 0, GATE.maxAccuracy ?? 100);
    const radius = GATE.radius ?? 100;
    const info = '店舗から約' + Math.round(d) + 'm（誤差 約' + Math.round(accuracy || 0) + 'm）';
    if (d - slack <= radius) { savePass(); gateOpen(); return; }
    gateMessage('お店の中で開いてください。お店から少しはなれているようです。' + (GATE.helpText ? '\n' + GATE.helpText : ''), info);
  }, err => {
    btn.disabled = false; btn.textContent = 'もう一度確認する';
    if (err.code === 1) {
      gateMessage('位置情報が許可されていません。ブラウザの設定で、このページの位置情報を許可してから、もう一度お試しください。');
    } else if (err.code === 3) {
      gateMessage('位置を取得するのに時間がかかっています。電波のよい場所で、もう一度お試しください。');
    } else {
      gateMessage('位置を取得できませんでした。端末の位置情報がオンか確認して、もう一度お試しください。');
    }
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

$('gateGo').addEventListener('click', checkLocation);
if (gateOn && !hasPass()) {
  if (CFG.stamps[0]) $('gateHero').src = CFG.stamps[0].thumb;
  $('start').hidden = true;
  $('gate').hidden = false;
}

$('flip').addEventListener('click', async () => {
  running = false;
  try { await startCamera(facing === 'user' ? 'environment' : 'user'); }
  catch (e) { try { await startCamera(facing); } catch (_) {} }
  running = true;
});

let lastBlob = null, lastURL = null, shotToken = 0;
const snap = $('snap'), shot = $('shot'), saveBtn = $('save');

$('shutter').addEventListener('click', () => {
  if (!running) return;
  running = false;                       // 重い顔認識をすぐ止める
  const token = ++shotToken;
  lastBlob = null;

  // 1) 今の画面をその場で確保する（ここで撮影が確定）
  const blobPromise = new Promise(res => cv.toBlob(res, 'image/jpeg', 0.92));
  snap.width = cv.width; snap.height = cv.height;
  snap.getContext('2d').drawImage(cv, 0, 0);

  // 2) JPEGの変換を待たずに、すぐプレビューを出す
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = '.85';
  requestAnimationFrame(() => { f.style.transition = 'opacity .35s'; f.style.opacity = '0'; });
  shot.hidden = true; snap.hidden = false;
  $('preview').hidden = false; $('strip').hidden = true;
  saveBtn.disabled = true; saveBtn.textContent = '保存の準備中…';

  // 3) JPEGができたら、長押し保存もできる画像に差し替える
  blobPromise.then(async blob => {
    if (token !== shotToken) return;     // 撮り直し済みなら何もしない
    if (!blob) { saveBtn.textContent = '保存できませんでした。撮り直してください'; return; }
    lastBlob = blob;
    if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(blob);
    shot.src = lastURL;
    try { await shot.decode(); } catch (_) {}
    if (token !== shotToken) return;
    shot.hidden = false; snap.hidden = true;
    saveBtn.disabled = false; saveBtn.textContent = '保存・共有';
  });
});

$('retake').addEventListener('click', () => {
  shotToken++;                           // 準備中の処理があれば取り消す
  $('preview').hidden = true; $('strip').hidden = false; running = true;
});

$('save').addEventListener('click', async () => {
  if (!lastBlob) return;
  const file = new File([lastBlob], 'bear-photo.jpg', { type: 'image/jpeg' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = lastURL; a.download = 'bear-photo.jpg';
  document.body.appendChild(a); a.click(); a.remove();
});

requestAnimationFrame(draw);
</script>
</body>
</html>
